{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>Entrar</h1>
    </div>
    <form method="post" style="display:flex;flex-direction:column;gap:1rem;">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password">
      </div>
      {% if form.errors %}
        <div class="message message--error">Usuário ou senha incorretos.</div>
      {% endif %}
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Entrar</button>
    </form>
    <p class="auth-footer">
      Não tem conta? <a href="/auth/cadastro/">Criar conta</a>
    </p>
  </div>
</div>
{% endblock %}
